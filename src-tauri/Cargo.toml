[package]
name = "ctf-toolbox"
version = "1.0.0"
description = "Offline-first CTF toolbox (CyberChef, JWT, revshell, payloads and more)"
authors = ["iselt"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "ctf_toolbox_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-http = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
